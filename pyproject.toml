[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "certified-optimization-lab"
version = "1.1.0"
description = "Reproducible numerical optimization, convex certificates, recommendation and combinatorial search"
authors = [{name = "Navid Bagheri-Shouraki"}]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<2", "scipy>=1.13,<2", "cvxpy==1.7.5", "clarabel==0.11.1", "matplotlib>=3.8,<4", "pandas>=2.1,<3", "scikit-learn>=1.3,<2"]
[project.optional-dependencies]
recommendation = ["torch>=2.4,<3"]
routing = ["ortools==9.14.6206"]
search = ["optuna==5.0.0"]
notebooks = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "scikit-learn>=1.3,<2"]
dev = ["pytest>=7", "ruff>=0.6", "build>=1"]
[project.scripts]
optimization-lab = "optimization_lab.console:main"
[project.urls]
Repository = "https://github.com/navidbagheri7/certified-optimization-lab"
Documentation = "https://github.com/navidbagheri7/certified-optimization-lab#readme"
Demo = "https://navidbagheri7.github.io/certified-optimization-lab/"
Issues = "https://github.com/navidbagheri7/certified-optimization-lab/issues"

[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
exclude = ["legacy", ".local", "results", "build", "notebooks"]
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
optimization_lab = ["default_configs/*.json", "example_assets/*.npz", "example_assets/*.json"]
